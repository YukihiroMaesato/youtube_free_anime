server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php index.html;

    # Frontend (Next.js)
    location / {
        proxy_pass http://frontend_youtube_free_anime:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # default.conf の該当部分
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.youtube.com https://youtube-nocookie.com; script-src 'self' ${CSP_SCRIPT_SRC} https://www.youtube.com https://ytimg.com; img-src 'self' data: https://ytimg.com;" always;
    }

    # Laravel API
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass backend_youtube_free_anime:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
    }
}

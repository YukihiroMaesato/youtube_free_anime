# ログフォーマット設定（そのまま維持）
log_format secure_main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent"';

access_log /var/log/nginx/daily/access.log secure_main;
error_log /var/log/nginx/daily/error.log warn;

# ==========================================
# 1. HTTP (80) の設定: すべて HTTPS へ強制リダイレクト
# ==========================================
server {
    listen 80;
    server_name simpletk202.com localhost; # localhostも残しています

    # Certbotの自動更新用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api {
        # ここで直接 fastcgi に渡すのはあまり一般的ではないですが、リダイレクト前にAPIリクエストを処理するため
        include fastcgi_params;
        fastcgi_pass backend_youtube_free_anime:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }

    # それ以外のHTTPアクセスはすべてHTTPSへリダイレクト
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==========================================
# 2. HTTPS (443) の設定: メインの処理
# ==========================================
server {
    listen 443 ssl;
    server_name simpletk202.com localhost;

    # 取得したSSL証明書のパス
    ssl_certificate /etc/letsencrypt/live/simpletk202.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simpletk202.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/public;
    index index.php index.html;

    # ------------------------------------------
    # Frontend (Next.js)
    # ------------------------------------------
    location / {
        proxy_pass http://frontend_youtube_free_anime:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # 👇 LaravelやブラウザにHTTPSであることを伝えるヘッダーを追加
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CSPヘッダー設定（そのまま維持）
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https://www.youtube.com https://youtube-nocookie.com; script-src 'self' ${CSP_SCRIPT_SRC} https://www.youtube.com https://ytimg.com https://www.googletagmanager.com; img-src 'self' data: https://ytimg.com https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://analytics.google.com https://www.google-analytics.com https://stats.g.doubleclick.net;" always;
    }

    # ------------------------------------------
    # Laravel API ルーティング
    # ------------------------------------------
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------
    # PHP (FastCGI) の処理
    # ------------------------------------------
    location ~ \.php$ {
        fastcgi_pass backend_youtube_free_anime:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/public;

        # 👇 Laravelに「いまHTTPS通信だよ」と明示的に伝えるための設定
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
}